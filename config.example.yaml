# minecrauth YAML Configuration Example
#
# This file contains all configuration options for the minecrauth server.
#
# Load this file using the required `--config` command-line flag:
#   minecrauth --config /path/to/config.yaml
#
# BEFORE parsing this YAML, the server passes the file content through environment-variable
# expansion (using `os.ExpandEnv`). This means any references like `${VAR}` or `$VAR` will be
# substituted with the corresponding environment variables. This is particularly useful for
# keeping secrets like database credentials or SMTP passwords out of plain-text config files.
#
# CAVEAT:
# A literal `$` followed by a word-like pattern will be treated as an environment variable and
# expanded (which results in an empty string if that environment variable is not defined).
# The only built-in default containing a `$` is the player-name regex ("^[a-zA-Z0-9_]{2,16}$").
# Because the `$` in that regex is at the end and quoted, it is safe from unwanted expansion.
# If you need to use a literal `$` in any field, escape it by doubling it (i.e. `$$`).

# ==============================================================================
# Core/Server Settings
# ==============================================================================

# Required: The external HTTP/HTTPS base URL of the auth server.
# This URL is used by launchers and servers to verify textures and request resources.
base_url: "http://localhost:25585"

# The TCP address the HTTP server listens on.
# Default: "0.0.0.0:25585"
listen_addr: "0.0.0.0:25585"

# The path to the directory where stateful assets (like the SQLite database) are stored.
# Default: "./data"
state_dir: "./data"

# The human-readable name of the Minecraft auth server. Advertised in metadata.
# Default: "minecrauth"
server_name: "minecrauth"

# ==============================================================================
# URL Path Prefixes
# ==============================================================================

# The URL path prefix under which the Yggdrasil API is mounted.
# Default: "/authlib-injector"
yggdrasil_prefix: "/authlib-injector"

# The URL path prefix for the privileged admin management API surface.
# Keep this separate from api_prefix to restrict it easily at the reverse-proxy level.
# Default: "/admin"
admin_prefix: "/admin"

# The URL path prefix for the public management API surface.
# Default: "/api"
api_prefix: "/api"

# ==============================================================================
# Accounts & Registration
# ==============================================================================

# Enforce that every new self-service registration must supply a valid invite code
# generated by an administrator. Registrations without a code will be rejected.
# Default: false
require_invite: false

# A list of email addresses that must exist and have admin rights at startup.
# If they do not exist, they will be created automatically with a generated password logged once.
# Default: [] (empty)
default_admins: []
# Example:
# default_admins:
#   - "admin@example.com"
#   - "super@example.com"

# The maximum number of Minecraft player profiles one user may own. Set to -1 for unlimited.
# Default: 3
max_players_per_user: 3

# The minimum password length required during user registration.
# Default: 8
min_password_length: 8

# ==============================================================================
# Tokens & Sessions
# ==============================================================================

# The duration in seconds until an opaque Yggdrasil access token expires.
# Set to 0 to mean the token never expires automatically.
# Default: 0
token_expiry_seconds: 0

# The lifetime of a browser UI session in seconds.
# Default: 604800 (7 days)
session_ttl_seconds: 604800

# ==============================================================================
# Rate Limiting & Request Body
# ==============================================================================

# The allowed requests per second per client IP address.
# Default: 25.0
rate_limit_rps: 25.0

# The burst limit of requests allowed for the rate limiter.
# Default: 100
rate_limit_burst: 100

# The maximum size in bytes allowed for incoming request bodies.
# Default: 1048576 (1MB)
body_limit_bytes: 1048576

# ==============================================================================
# Player Names & UUIDs
# ==============================================================================

# Regular expression that all player names must match.
# Default: "^[a-zA-Z0-9_]{2,16}$"
player_name_regex: "^[a-zA-Z0-9_]{2,16}$"

# Controls how player UUIDs are generated when no UUID is supplied.
#   "random"  - Generates a cryptographically random V4 UUID.
#   "offline" - Derives the UUID from the player name using the offline-mode algorithm.
# Default: "random"
uuid_generation: "random"

# ==============================================================================
# Skins & Capes
# ==============================================================================

# The maximum skin/cape image width/height in pixels accepted on upload.
# Set to 0 for unlimited (allows high-res skins).
# Default: 64
skin_size_limit: 64

# Controls whether self-service skin uploads are accepted.
# Default: true
allow_skins: true

# Controls whether self-service cape uploads are accepted.
# Default: true
allow_capes: true

# Permits fetching a texture from an arbitrary HTTP/HTTPS URL instead of direct upload.
# WARNING: Disabled by default to prevent Server-Side Request Forgery (SSRF).
# Default: false
allow_texture_from_url: false

# ==============================================================================
# Fallback / Mixed Authentication
# ==============================================================================

# Upstream Yggdrasil-compatible servers to consult when a player profile is not known locally.
# Default: [] (empty, feature disabled)
#
# fallback_api_servers:
#   - nickname: "mojang"
#     account_url: "https://api.mojang.com"
#     session_url: "https://sessionserver.mojang.com"
#     skin_domains:
#       - "textures.minecraft.net"
#     cache_ttl_seconds: 300
#     deny_unknown_users: false
#     enable_authentication: true

# Enable skin forwarding: when a local player has no skin assigned, fetch their profile
# from the first configured fallback server and inject the fallback's texture properties verbatim.
# Default: false
forward_skins: false

# Enable offline-UUID skin lookup: if a profile is requested by UUID and not found locally,
# scan all local players and check if their offline UUID matches.
# Default: false
offline_skins: false

# ==============================================================================
# OIDC Connector Shape
# ==============================================================================

# The OIDC provider discovery URL (e.g. Keycloak, Google, Authentik, etc.).
# Default: "" (OIDC disabled)
oidc_issuer: ""

# The OAuth 2.0 / OIDC client ID registered with the provider.
# Default: ""
oidc_client_id: ""

# The OAuth 2.0 / OIDC client secret registered with the provider.
# Default: ""
oidc_client_secret: ""

# The redirect URL registered with the OIDC provider.
# Default: BaseURL + "/oauth/callback"
oidc_redirect_url: ""

# Automatically create a non-admin local user account on successful OIDC login
# if the email is not yet known in the database.
# Default: false
oidc_auto_provision: false

# ==============================================================================
# Email & SMTP Settings
# ==============================================================================

# The SMTP host address for delivering emails.
# Default: "" (email delivery disabled)
smtp_host: ""

# The SMTP port number.
# Default: 587
smtp_port: 587

# The SMTP username for authentication.
# Default: ""
smtp_username: ""

# The SMTP password for authentication. Shows environment variable expansion.
# Default: ""
smtp_password: "${SMTP_PASSWORD}"

# The "From" email address used as the sender.
# Default: ""
smtp_from: ""

# Sets the SMTP TLS connection policy. Valid values: "starttls", "tls", "none".
# Default: "starttls"
smtp_tls_mode: "starttls"

# Enforce that new self-service registrations must verify their email address before logging in.
# Default: false
require_email_verification: false

# ==============================================================================
# Logging Settings
# ==============================================================================

# The structured log output format. Valid values: "json" or "text".
# Default: "json"
log_format: "json"

# The minimum level of logs to emit. Valid values: "debug", "info", "warn", "error".
# Default: "info"
log_level: "info"
