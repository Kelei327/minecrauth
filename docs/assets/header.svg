<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" fill="none" role="img" aria-label="minecrauth - self-hosted authentication for Minecraft Java Edition">
  <!-- Panel background with hard Minecraft-style bevel (no blur, square corners) -->
  <rect width="900" height="220" fill="#0e0e0e"/>
  <rect x="4" y="4" width="892" height="212" fill="#1a1a1a"/>
  <!-- top/left light bevel -->
  <path d="M4 4 H896 V10 H10 V216 H4 Z" fill="#3d3d3d"/>
  <!-- bottom/right dark bevel -->
  <path d="M896 4 V216 H4 V210 H890 V10 H896 Z" fill="#000000"/>
  <!-- gold accent rule under the wordmark -->
  <rect x="250" y="150" width="372" height="3" fill="#c8a032"/>

  <!-- Grass-block logo (original 28px artwork scaled up) -->
  <g transform="translate(70 52) scale(4.0)">
    <!-- Top face (grass) -->
    <polygon points="14,1 27,7 14,13 1,7" fill="#70b237"/>
    <polygon points="14,3 24,7 14,11 4,7" fill="#5b8731"/>
    <rect x="13" y="5" width="2" height="2" fill="#3e5c20"/>
    <rect x="8" y="6" width="2" height="1" fill="#3e5c20"/>
    <rect x="18" y="6" width="2" height="1" fill="#3e5c20"/>
    <!-- Left face (dirt) -->
    <polygon points="1,7 14,13 14,27 1,21" fill="#7a543a"/>
    <polygon points="1,7 14,13 14,17 9,15 6,16 1,10" fill="#5b8731"/>
    <polygon points="1,7 14,13 14,15 10,13 5,14 1,9" fill="#70b237"/>
    <rect x="4" y="18" width="2" height="2" fill="#5a3d2b"/>
    <rect x="9" y="20" width="2" height="2" fill="#5a3d2b"/>
    <rect x="11" y="16" width="1" height="2" fill="#3e5c20"/>
    <!-- Right face (dark dirt) -->
    <polygon points="14,13 27,7 27,21 14,27" fill="#5a3d2b"/>
    <polygon points="14,13 27,7 27,10 22,12 18,11 14,17" fill="#3e5c20"/>
    <polygon points="14,13 27,7 27,9 23,10 19,10 14,15" fill="#5b8731"/>
    <rect x="17" y="19" width="2" height="2" fill="#3c261b"/>
    <rect x="22" y="16" width="2" height="2" fill="#3c261b"/>
    <rect x="15" y="22" width="2" height="1" fill="#3c261b"/>
  </g>

  <!-- Wordmark -->
  <text x="250" y="118" font-family="'Courier New',ui-monospace,Menlo,Consolas,monospace" font-size="64" font-weight="700" letter-spacing="1" fill="#e9e9e9">minecrauth</text>

  <!-- Slogan -->
  <text x="252" y="182" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#9a9a9a">Self-hosted authentication for Minecraft: Java Edition</text>
</svg>
