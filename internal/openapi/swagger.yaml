      description: Overrides the arm model (classic or slim) of the player's existing
        skin without re-uploading.
      parameters:
      - description: Player ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.SetSkinModelRequest'
                description: Skin model
                summary: request
        description: Skin model
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.Player'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Not Found
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Set player skin model
      tags:
      - Skins
  /api/me/players/{id}/skin/url:
    put:
      description: Downloads a PNG skin file from the specified URL and sets it for
        the player profile. (Requires AllowSkins config flag to be true)
      parameters:
      - description: Player ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.SkinURLRequest'
                description: Skin URL configuration
                summary: request
        description: Skin URL configuration
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.Player'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Not Found
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Upload player skin from URL
      tags:
      - Skins
  /api/me/players/{id}/uuid:
    put:
      description: 'Sets a new profile UUID for a player owned by the authenticated
        user. An empty uuid regenerates one per the server policy. Warning: a player''s
        UUID is its identity on Minecraft servers (inventories, permissions, progress
        are keyed by it), so changing it makes the player a different identity to
        any server it has joined.'
      parameters:
      - description: Player ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.ChangePlayerUUIDRequest'
                description: New UUID (empty to regenerate)
                summary: request
        description: New UUID (empty to regenerate)
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.Player'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Conflict
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Change player profile UUID
      tags:
      - Players
  /api/me/totp/confirm:
    post:
      description: Validates a TOTP code, enables TOTP for the user, and returns recovery
        codes.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.TOTPConfirmRequest'
                description: TOTP setup confirmation code
                summary: request
        description: TOTP setup confirmation code
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Plaintext recovery codes
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Confirm TOTP setup
      tags:
      - Accounts
  /api/me/totp/disable:
    post:
      description: Disables TOTP 2FA for the user. Requires a valid current TOTP code
        or a recovery code, unless performed by an impersonating admin.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.TOTPDisableRequest'
                description: TOTP disable verification
                summary: request
        description: TOTP disable verification
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Success status
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Disable TOTP
      tags:
      - Accounts
  /api/me/totp/setup:
    post:
      description: Generates a new TOTP secret and returns the otpauth:// URL and
        base32 secret.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OTP auth URL and secret
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Begin TOTP setup
      tags:
      - Accounts
  /api/register:
    post:
      description: Create a new user account. Required if require_invite is enabled.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.RegisterRequest'
                description: Registration data
                summary: request
        description: Registration data
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.User'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Conflict
      summary: Self-service registration
      tags:
      - Accounts
  /authlib-injector/:
    get:
      description: Serves the authlib-injector metadata document including implementation
        version and public signing keys.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/yggdrasil.MetadataResponse'
          description: OK
      summary: Yggdrasil Metadata
      tags:
      - Yggdrasil
  /authlib-injector/api/profiles/minecraft:
    post:
      description: Resolves a batch of player names to their undashed UUIDs.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - items:
                  type: string
                title: names
                type: array
        description: List of player names to lookup (max 100)
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/yggdrasil.ProfileStub'
                type: array
          description: OK
      summary: Bulk name-to-UUID lookup
      tags:
      - Yggdrasil
  /authlib-injector/authserver/authenticate:
    post:
      description: Authenticates a player using username/password, issues access and
        client tokens.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/yggdrasil.AuthenticateRequest'
                description: Authentication credentials
                summary: request
        description: Authentication credentials
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/yggdrasil.AuthenticateResponse'
          description: OK
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/yggdrasil.YggError'
          description: 'ForbiddenOperationException: invalid credentials'
      summary: Authenticate player
      tags:
      - Yggdrasil
  /authlib-injector/authserver/invalidate:
    post:
      description: Invalidates/revokes the provided accessToken (idempotent).
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/yggdrasil.InvalidateRequest'
                description: Invalidate request parameters
                summary: request
        description: Invalidate request parameters
        required: true
      responses:
        "204":
          description: Token invalidated
      summary: Invalidate token
      tags:
      - Yggdrasil
  /authlib-injector/authserver/refresh:
    post:
      description: Rotates the access token and optionally client token, returning
        new ones.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/yggdrasil.RefreshRequest'
                description: Refresh request parameters
                summary: request
        description: Refresh request parameters
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/yggdrasil.RefreshResponse'
          description: OK
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/yggdrasil.YggError'
          description: 'ForbiddenOperationException: invalid token'
      summary: Refresh token
      tags:
      - Yggdrasil
  /authlib-injector/authserver/signout:
    post:
      description: Authenticates and invalidates all active tokens for the user.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/yggdrasil.SignoutRequest'
                description: Signout request parameters
                summary: request
        description: Signout request parameters
        required: true
      responses:
        "204":
          description: User signed out and all tokens invalidated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/yggdrasil.YggError'
          description: 'ForbiddenOperationException: invalid credentials'
      summary: Sign out user
      tags:
      - Yggdrasil
  /authlib-injector/authserver/validate:
    post:
      description: Validates the provided accessToken.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/yggdrasil.ValidateRequest'
                description: Validate request parameters
                summary: request
        description: Validate request parameters
        required: true
      responses:
        "204":
          description: Token is valid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/yggdrasil.YggError'
          description: 'ForbiddenOperationException: invalid token'
      summary: Validate token
      tags:
      - Yggdrasil
  /authlib-injector/sessionserver/session/minecraft/hasJoined:
    get:
      description: Queries the sessionserver to verify if a player has joined a multiplayer
        server.
      parameters:
      - description: Minecraft player username
        in: query
        name: username
        required: true
        schema:
          type: string
      - description: Server ID generated by the client
        in: query
        name: serverId
        required: true
        schema:
          type: string
      - description: Player's IP address
        in: query
        name: ip
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/yggdrasil.FullProfile'
          description: OK
        "204":
          description: Player has not joined
      summary: Has joined server
      tags:
      - Yggdrasil
  /authlib-injector/sessionserver/session/minecraft/join:
    post:
      description: Informs the sessionserver that a player is joining a multiplayer
        server.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/yggdrasil.JoinRequest'
                description: Join request parameters
                summary: request
        description: Join request parameters
        required: true
      responses:
        "204":
          description: Join recorded
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/yggdrasil.YggError'
          description: 'ForbiddenOperationException: invalid token or profile'
      summary: Join server
      tags:
      - Yggdrasil
  /authlib-injector/sessionserver/session/minecraft/profile/{id}:
    get:
      description: Returns the full profile for a player including skin/cape properties
        and optional signatures.
      parameters:
      - description: Player ID (undashed UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: 'Whether to exclude signatures (default: false)'
        in: query
        name: unsigned
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/yggdrasil.FullProfile'
          description: OK
        "204":
          description: Profile not found
      summary: Get player profile
      tags:
      - Yggdrasil
  /forgot-password:
    post:
      description: Initiates the password reset flow. Always returns 200 "ok" even
        if the email does not exist to prevent user enumeration. If the user exists,
        a password reset link is emailed.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.ForgotPasswordRequest'
                description: Forgot password data
                summary: request
        description: Forgot password data
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Internal Server Error
      summary: Request password reset email
      tags:
      - Account
  /oauth/callback:
    get:
      description: Handles the callback from OIDC Identity Provider, exchanges code
        for token, starts session, and redirects to /players.
      parameters:
      - description: Auth code from provider
        in: query
        name: code
        schema:
          type: string
      - description: State for CSRF validation
        in: query
        name: state
        schema:
          type: string
      responses:
        "302":
          description: Redirect to /players
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
      summary: OIDC callback
      tags:
      - OIDC
  /oauth/login:
    get:
      description: Initiates OIDC login flow by redirecting the browser to the Identity
        Provider.
      responses:
        "302":
          description: Redirect to Identity Provider
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Not Found
      summary: OIDC browser login
      tags:
      - OIDC
  /resend-verification:
    post:
      description: Resends the email verification link to the user if they are not
        yet verified. Always returns 200 "ok" even if the email does not exist.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.ResendVerificationRequest'
                description: Resend verification data
                summary: request
        description: Resend verification data
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Internal Server Error
      summary: Resend email verification
      tags:
      - Account
  /reset-password:
    post:
      description: Consumes a single-use password reset token and sets a new password.
        If successful, all active browser sessions and Yggdrasil tokens for the user
        are immediately revoked.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.ResetPasswordRequest'
                description: Reset password data
                summary: request
        description: Reset password data
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Internal Server Error
      summary: Reset password via token
      tags:
      - Account
  /verify-email:
    post:
      description: Consumes a single-use verification token to mark the user's email
        address as verified.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.VerifyEmailRequest'
                description: Verify email data
                summary: request
        description: Verify email data
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Internal Server Error
      summary: Verify email address
      tags:
      - Account
  /web/api/config:
    get:
      description: Returns configuration flags that control the Web UI features (e.g.
        OIDC, Skin/Cape options, invite requirements).
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: UI configuration parameters
      summary: Get server UI config
      tags:
      - Session
  /web/api/login:
    post:
      description: Authenticates the user and sets a session cookie.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.LoginRequest'
                description: Login credentials
                summary: request
        description: Login credentials
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Session details including user profile and csrfToken
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
      summary: Web login
      tags:
      - Session
  /web/api/login-totp:
    post:
      description: Completes two-step login using a TOTP token and code, then sets
        a session cookie.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.LoginTOTPRequest'
                description: Login TOTP request
                summary: request
        description: Login TOTP request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Session details including user profile and csrfToken
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
      summary: Web TOTP login
      tags:
      - Session
  /web/api/logout:
    post:
      description: Revokes and clears the current browser session.
      responses:
        "204":
          description: No Content
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
      summary: Web logout
      tags:
      - Session
  /web/api/session:
    get:
      description: Validates the session cookie and returns current session details
        including the user profile and csrfToken.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Session status and details
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
      summary: Get current web session
      tags:
      - Session
  /web/api/stop-impersonation:
    post:
      description: Reverts an impersonated session back to the admin session.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Restored admin session details
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
      summary: Stop impersonation
      tags:
      - Session
servers:
- url: /
