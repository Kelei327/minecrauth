components:
  schemas:
    httpserver.APIError:
      properties:
        error:
          type: string
        message:
          type: string
      type: object
    httpserver.AdminCreateUserRequest:
      properties:
        email:
          type: string
        isAdmin:
          type: boolean
        password:
          type: string
      type: object
    httpserver.CapeURLRequest:
      properties:
        url:
          type: string
      type: object
    httpserver.ChangePlayerUUIDRequest:
      properties:
        uuid:
          type: string
      type: object
    httpserver.CreateInviteRequest:
      properties:
        ttlSeconds:
          type: integer
      type: object
    httpserver.CreatePlayerRequest:
      properties:
        name:
          type: string
        uuid:
          type: string
      type: object
    httpserver.ForgotPasswordRequest:
      properties:
        email:
          type: string
      type: object
    httpserver.LoginRequest:
      properties:
        email:
          type: string
        password:
          type: string
      type: object
    httpserver.LoginTOTPRequest:
      properties:
        code:
          type: string
        totpToken:
          type: string
      type: object
    httpserver.RegisterRequest:
      properties:
        email:
          type: string
        inviteCode:
          type: string
        password:
          type: string
      type: object
    httpserver.RenamePlayerRequest:
      properties:
        name:
          type: string
      type: object
    httpserver.ResendVerificationRequest:
      properties:
        email:
          type: string
      type: object
    httpserver.ResetPasswordRequest:
      properties:
        password:
          type: string
        token:
          type: string
      type: object
    httpserver.ResetTokenResponse:
      properties:
        expiresInSeconds:
          type: integer
        resetUrl:
          type: string
      type: object
    httpserver.SetAdminRequest:
      properties:
        isAdmin:
          type: boolean
      type: object
    httpserver.SetBlockedRequest:
      properties:
        blocked:
          type: boolean
      type: object
    httpserver.SetGamePasswordRequest:
      properties:
        password:
          type: string
      type: object
    httpserver.SetSkinModelRequest:
      properties:
        model:
          type: string
      type: object
    httpserver.SkinURLRequest:
      properties:
        model:
          type: string
        url:
          type: string
      type: object
    httpserver.TOTPConfirmRequest:
      properties:
        code:
          type: string
      type: object
    httpserver.TOTPDisableRequest:
      properties:
        code:
          type: string
      type: object
    httpserver.UpdateEmailRequest:
      properties:
        email:
          type: string
      type: object
    httpserver.UpdatePasswordRequest:
      properties:
        password:
          type: string
      type: object
    httpserver.VerifyEmailRequest:
      properties:
        token:
          type: string
      type: object
    store.Invite:
      properties:
        code:
          type: string
        created_at:
          type: string
        created_by:
          description: UserID of admin
          type: string
        expires_at:
          description: Nullable
          type: string
        used_by:
          description: Nullable UserID
          type: string
      type: object
    store.Player:
      properties:
        cape_hash:
          type: string
        created_at:
          type: string
        id:
          type: string
        name:
          type: string
        name_changed_at:
          type: string
        skin_hash:
          description: Texture fields added in migration 5.
          type: string
        skin_model:
          type: string
        user_id:
          type: string
        uuid:
          description: Canonical UUID representation with dashes
          type: string
      type: object
    store.User:
      properties:
        blocked:
          type: boolean
        created_at:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        game_password_set:
          type: boolean
        id:
          type: string
        is_admin:
          type: boolean
        preferred_language:
          type: string
        totp_enabled:
          description: true once confirmed; exposed to the UI
          type: boolean
        updated_at:
          type: string
      type: object
    yggdrasil.AuthenticateRequest:
      properties:
        agent:
          $ref: '#/components/schemas/yggdrasil.agentField'
        clientToken:
          type: string
        password:
          type: string
        requestUser:
          type: boolean
        username:
          type: string
      type: object
    yggdrasil.AuthenticateResponse:
      properties:
        accessToken:
          type: string
        availableProfiles:
          items:
            $ref: '#/components/schemas/yggdrasil.ProfileStub'
          type: array
          uniqueItems: false
        clientToken:
          type: string
        selectedProfile:
          $ref: '#/components/schemas/yggdrasil.ProfileStub'
        user:
          $ref: '#/components/schemas/yggdrasil.UserResponse'
      type: object
    yggdrasil.FullProfile:
      properties:
        id:
          description: undashed 32-hex UUID
          type: string
        name:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/yggdrasil.TextureProperty'
          type: array
          uniqueItems: false
      type: object
    yggdrasil.InvalidateRequest:
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
      type: object
    yggdrasil.JoinRequest:
      properties:
        accessToken:
          type: string
        selectedProfile:
          description: undashed 32-hex UUID
          type: string
        serverId:
          type: string
      type: object
    yggdrasil.MetadataResponse:
      properties:
        meta:
          $ref: '#/components/schemas/yggdrasil.metaMeta'
        signaturePublickey:
          type: string
        skinDomains:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    yggdrasil.ProfileStub:
      properties:
        id:
          type: string
        name:
          type: string
      type: object
    yggdrasil.RefreshRequest:
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
        requestUser:
          type: boolean
        selectedProfile:
          $ref: '#/components/schemas/yggdrasil.ProfileStub'
      type: object
    yggdrasil.RefreshResponse:
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
        selectedProfile:
          $ref: '#/components/schemas/yggdrasil.ProfileStub'
        user:
          $ref: '#/components/schemas/yggdrasil.UserResponse'
      type: object
    yggdrasil.SignoutRequest:
      properties:
        password:
          type: string
        username:
          type: string
      type: object
    yggdrasil.TextureProperty:
      properties:
        name:
          type: string
        signature:
          type: string
        value:
          type: string
      type: object
    yggdrasil.UserProperty:
      properties:
        name:
          type: string
        value:
          type: string
      type: object
    yggdrasil.UserResponse:
      properties:
        id:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/yggdrasil.UserProperty'
          type: array
          uniqueItems: false
      type: object
    yggdrasil.ValidateRequest:
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
      type: object
    yggdrasil.YggError:
      properties:
        cause:
          type: string
        error:
          type: string
        errorMessage:
          type: string
      type: object
    yggdrasil.agentField:
      properties:
        name:
          type: string
        version:
          type: integer
      type: object
    yggdrasil.metaMeta:
      properties:
        implementationName:
          type: string
        implementationVersion:
          type: string
        serverName:
          type: string
      type: object
  securitySchemes:
    BasicAuth:
      in: header
      name: X-CSRF-Token
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: Yggdrasil-compatible Minecraft authentication server. Management endpoints
    accept either an HTTP Basic credential or a browser session cookie; cookie-authenticated
    mutating requests also require the X-CSRF-Token header.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: minecrauth API
  version: "1.0"
openapi: 3.1.0
paths:
  /admin/backup:
    get:
      description: Creates a consistent SQLite snapshot, bundles it with the signing
        key, textures, and config, and streams a .tar.gz archive.
      responses:
        "200":
          content:
            application/gzip:
              schema:
                type: file
          description: backup archive
        "500":
          content:
            application/gzip:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Internal server error
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Download a complete backup archive
      tags:
      - Admin
  /admin/invites:
    get:
      description: Returns a list of all active or used registration invite codes.
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/store.Invite'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: List invites (Admin only)
      tags:
      - Admin
    post:
      description: Generates a new registration invite code with an optional TTL.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.CreateInviteRequest'
                description: Invite settings
                summary: request
        description: Invite settings
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.Invite'
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Create invite code (Admin only)
      tags:
      - Admin
  /admin/invites/{code}:
    delete:
      description: Deletes/revokes a specific registration invite code.
      parameters:
      - description: Invite Code
        in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Not Found
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Delete invite code (Admin only)
      tags:
      - Admin
  /admin/restore:
    post:
      description: Reads a .tar.gz archive, validates its structure, and stages it
        to be applied at next startup.
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
          application/x-gzip:
            schema:
              type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: restore staged successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Invalid backup file
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Internal server error
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Upload a backup archive to stage for restore
      tags:
      - Admin
  /admin/users:
    get:
      description: Returns a list of all user accounts in the system.
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/store.User'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: List all users (Admin only)
      tags:
      - Admin
    post:
      description: Creates a new user account (admin bypasses self-registration restrictions).
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.AdminCreateUserRequest'
                description: User creation data
                summary: request
        description: User creation data
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.User'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Conflict
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Create user (Admin only)
      tags:
      - Admin
  /admin/users/{id}:
    delete:
      description: Deletes a user account and all associated player profiles and textures.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Not Found
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Delete user (Admin only)
      tags:
      - Admin
    get:
      description: Returns details of a specific user account.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.User'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Not Found
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Get user by ID (Admin only)
      tags:
      - Admin
  /admin/users/{id}/admin:
    put:
      description: Promotes or demotes a user's admin privilege level.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.SetAdminRequest'
                description: Admin status data
                summary: request
        description: Admin status data
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.User'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Not Found
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Set user admin status (Admin only)
      tags:
      - Admin
  /admin/users/{id}/blocked:
    put:
      description: Blocks or unblocks a user account. Blocking a user immediately
        revokes all of their active sessions and tokens.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.SetBlockedRequest'
                description: Blocked status data
                summary: request
        description: Blocked status data
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.User'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Not Found
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Set user blocked status (Admin only)
      tags:
      - Admin
  /admin/users/{id}/impersonate:
    post:
      description: Creates an impersonated browser session for the specified user,
        returning a new session cookie.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.User'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Not Found
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Impersonate user (Admin only)
      tags:
      - Admin
  /admin/users/{id}/players:
    get:
      description: Returns a list of player profiles owned by the specified user.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/store.Player'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Not Found
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: List user's players (Admin only)
      tags:
      - Admin
    post:
      description: Creates a new Minecraft player profile for the specified user.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.CreatePlayerRequest'
                description: Player creation data
                summary: request
        description: Player creation data
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.Player'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Conflict
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Create player profile for user (Admin only)
      tags:
      - Admin
  /admin/users/{id}/players/{pid}:
    delete:
      description: Deletes a player profile owned by the specified user.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Player ID
        in: path
        name: pid
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Not Found
      security:
      - BasicAuth: []
      - CSRFToken: []
      summary: Delete user's player profile (Admin only)
      tags:
      - Admin
    patch:
      description: Renames a player profile owned by the specified user.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Player ID
        in: path
        name: pid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/httpserver.RenamePlayerRequest'
                description: New player name
                summary: request
        description: New player name
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.Player'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpserver.APIError'
          description: Conflict
      security:
